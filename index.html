<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дошка завдань</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Оновлена палітра: темно-фіолетові відтінки */
    --bg-linear: linear-gradient(135deg, #0f0c1b 0%, #1a102f 50%, #0a0618 100%);
    --surface:#171126;
    --surface-2:#221a36;
    --ink:#ECEEEC;
    --ink-dim:#A59CB5;
    --ink-faint:#766D85;
    --line:#2E2445;
    --line-soft:#281F3D;
    --accent:#9B86FA;
    --accent-ink:#0A0618;
    --low:#57B788;
    --med:#E0A83E;
    --high:#E2645A;
    --radius:12px;
    --shadow:0 4px 20px rgba(0,0,0,.4), 0 8px 32px -12px rgba(11,6,24,.6);
    font-size:16px;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; background: var(--bg-linear); color:var(--ink);
    font-family:'Inter',sans-serif; line-height:1.5;
    min-height:100vh; background-attachment: fixed;
  }
  .heading, h1, h2, .btn, .chip, .field label, .toolbar select, .toolbar-label{
    font-family:'Space Grotesk',sans-serif;
  }
  .wrap{ max-width:840px; margin:0 auto; padding:48px 24px 80px; }

  /* ---------- Header ---------- */
  header{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:8px; flex-wrap:wrap; }
  h1{ font-size:30px; font-weight:700; letter-spacing:-.01em; margin:0; color: #fff; text-shadow: 0 2px 10px rgba(155,134,250,0.2); }
  .subtitle{ color:var(--ink-dim); font-size:14px; margin-top:6px; }
  .count-pill{
    font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:600;
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:5px 12px; color:var(--ink-dim); white-space:nowrap;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin:28px 0 18px; flex-wrap:wrap;
  }
  .toolbar-left{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .toolbar-label{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; }
  .toolbar select{
    appearance:none; -webkit-appearance:none;
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:8px 32px 8px 12px; font-size:13.5px; color:var(--ink); font-weight:600;
    background-image:url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 20 20'%3E%3Cpath fill='%239AA097' d='M5 7l5 6 5-6z'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 10px center; cursor:pointer;
  }
  .toolbar select:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .btn{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px;
    border-radius:8px; padding:10px 16px; border:1px solid transparent; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); box-shadow: 0 4px 12px rgba(155,134,250,0.3); }
  .btn-primary:hover{ background:#b3a3ff; }
  .btn-ghost{ background:transparent; color:var(--ink-dim); border-color:var(--line); }
  .btn-ghost:hover{ border-color:var(--ink-faint); color:var(--ink); }
  .btn-text{ background:none; color:var(--ink-dim); padding:6px 8px; font-size:13px; border:none; cursor:pointer;}
  .btn-text:hover{ color:var(--ink); }
  .btn-danger-text{ background:none; color:var(--high); padding:6px 8px; font-size:13px; border:none; cursor:pointer;}
  .btn-danger-text:hover{ text-decoration:underline; }

  /* ---------- Add / Edit form ---------- */
  .task-form{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:16px; box-shadow:var(--shadow); display:none;
  }
  .task-form.is-visible{ display:block; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .field{ margin-bottom:14px; }
  .field.full{ grid-column:1 / -1; }
  .field label{ display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:6px; }
  .field input[type=text], .field input[type=date], .field select, .field textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
    padding:9px 11px; font-size:14px; font-family:'Inter',sans-serif; color:var(--ink);
    color-scheme:dark;
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible{
    outline:none; border-color:var(--accent); background:#292040;
  }
  .priority-picker{ display:flex; gap:8px; }
  .priority-opt{
    flex:1; text-align:center; padding:9px 6px; border-radius:7px; border:1px solid var(--line);
    background:var(--surface-2); font-size:12.5px; font-weight:600; cursor:pointer;
    color:var(--ink-dim); transition:all .15s ease; user-select:none;
  }
  .priority-opt[data-active="true"][data-level="low"]{ background:rgba(87,183,136,.16); border-color:var(--low); color:var(--low); }
  .priority-opt[data-active="true"][data-level="medium"]{ background:rgba(224,168,62,.16); border-color:var(--med); color:var(--med); }
  .priority-opt[data-active="true"][data-level="high"]{ background:rgba(226,100,90,.16); border-color:var(--high); color:var(--high); }
  .form-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }
  .form-error{ color:var(--high); font-size:12.5px; margin-top:-6px; margin-bottom:12px; display:none; }
  .form-error.is-visible{ display:block; }

  /* ---------- Task list ---------- */
  .list{ display:flex; flex-direction:column; gap:10px; }
  .task-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px 14px 14px; box-shadow:var(--shadow);
    display:flex; gap:12px; align-items:flex-start;
    border-left:4px solid var(--line);
  }
  .task-card[data-priority="low"]{ border-left-color:var(--low); }
  .task-card[data-priority="medium"]{ border-left-color:var(--med); }
  .task-card[data-priority="high"]{ border-left-color:var(--high); }
  .task-card.is-done { opacity:.45; }
  .task-card.is-done .task-title{ text-decoration:line-through; color:var(--ink-dim); }

  .check{
    flex:0 0 auto; width:20px; height:20px; margin-top:2px;
    accent-color:var(--accent); cursor:pointer;
  }
  .task-main{ flex:1; min-width:0; }
  .task-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .task-title{ font-weight:600; font-size:15.5px; word-break:break-word; }
  .task-desc{ color:var(--ink-dim); font-size:13.5px; margin-top:4px; line-height:1.55; word-break:break-word; }
  .task-meta{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }

  .chip{ font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:20px; white-space:nowrap; }
  .chip-priority[data-level="low"]{ background:rgba(87,183,136,.16); color:var(--low); }
  .chip-priority[data-level="medium"]{ background:rgba(224,168,62,.16); color:var(--med); }
  .chip-priority[data-level="high"]{ background:rgba(226,100,90,.16); color:var(--high); }
  .chip-date{ background:var(--surface-2); color:var(--ink-dim); border:1px solid var(--line-soft); font-family:'Inter',sans-serif; font-weight:500; }
  .chip-due{ font-family:'Inter',sans-serif; font-weight:600; }
  .chip-due[data-state="overdue"]{ background:rgba(226,100,90,.16); color:var(--high); }
  .chip-due[data-state="today"]{ background:rgba(224,168,62,.18); color:var(--med); }
  .chip-due[data-state="ok"]{ background:var(--surface-2); color:var(--ink-dim); border:1px solid var(--line-soft); }
  .chip-due[data-state="done"]{ background:var(--surface-2); color:var(--ink-faint); border:1px solid var(--line-soft); }

  .task-actions{ display:flex; gap:2px; flex:0 0 auto; }

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-dim);
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Дошка завдань</h1>
      <div class="subtitle">Ваш персональний менеджер списків та справ</div>
    </div>
    <div class="count-pill" id="task-counter">Завдань: 0</div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <span class="toolbar-label">Фільтр</span>
      <select id="filter-status">
        <option value="all">Усі завдання</option>
        <option value="active">Активні</option>
        <option value="done">Виконані</option>
      </select>

      <span class="toolbar-label">Сортування</span>
      <select id="sort-by">
        <option value="date-asc">Спочатку нові дедлайни</option>
        <option value="date-desc">Спочатку пізні дедлайни</option>
        <option value="priority-desc">Найважливіші попереду</option>
      </select>
    </div>
    <button class="btn btn-primary" id="toggle-form-btn">+ Нове завдання</button>
  </div>

  <!-- Form -->
  <form class="task-form" id="task-form">
    <input type="hidden" id="edit-task-id" value="">
    <div class="form-error" id="form-error">Будь ласка, заповніть назву завдання та оберіть коректну дату.</div>
    
    <div class="form-grid">
      <div class="field full">
        <label>Назва завдання *</label>
        <input type="text" id="form-title" placeholder="Що потрібно зробити?" required>
      </div>
      <div class="field full">
        <label>Опис (необов'язково)</label>
        <textarea id="form-desc" placeholder="Додайте деталі або нотатки..."></textarea>

  
</script>
